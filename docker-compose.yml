services:
  postgres:
    image: postgres:16
    container_name: social-logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_logistics
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
